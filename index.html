<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campamento 2026</title>
<meta name="description" content="Programa, rally, comunión.com, deportes y responsables del campamento Tiempo de conquistar 2026.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1f5d3f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Campamento">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
:root{
  --bg:#f6f3ec; --card:#ffffff; --ink:#1d2a22; --muted:#5d6b62; --line:#e3ddd0;
  --brand:#1f5d3f; --brand-ink:#ffffff; --accent:#d9822b; --soft:#e8f0ea; --soft2:#fbefe2;
  --now:#fff4d6; --now-line:#e8b641;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121814; --card:#1b231e; --ink:#e8ede9; --muted:#9db0a4; --line:#2c3830;
    --brand:#3f9b6c; --brand-ink:#0d1510; --accent:#f0a456; --soft:#22352a; --soft2:#3a2a1a;
    --now:#3a3218; --now-line:#c99a2e;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:var(--brand-ink);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:1.05rem;margin:0;flex:1;line-height:1.2}
header h1 small{display:block;font-weight:400;opacity:.85;font-size:.78rem}
.iconbtn{background:rgba(255,255,255,.16);border:0;border-radius:999px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;color:inherit}
.iconbtn svg{width:20px;height:20px}
main{max-width:760px;margin:0 auto;padding:14px 16px calc(90px + env(safe-area-inset-bottom))}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;background:none;border:0;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;color:var(--muted);cursor:pointer;border-radius:10px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--brand);font-weight:600}
nav.tabs button.on svg{stroke-width:2.4}
h2{font-size:1.25rem;margin:6px 0 10px}
h3{font-size:1rem;margin:18px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-size:.78rem}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;cursor:pointer;font-size:.9rem;white-space:nowrap}
.seg button.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.item{display:grid;grid-template-columns:86px 1fr;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px}
.time{font-variant-numeric:tabular-nums;font-weight:600;font-size:.88rem;color:var(--brand)}
.time small{display:block;font-weight:400;color:var(--muted)}
.act{font-weight:600}
.meta{color:var(--muted);font-size:.88rem;margin-top:2px}
.desc{font-size:.9rem;margin-top:4px}
.who{display:inline-flex;align-items:center;gap:4px;font-size:.88rem;margin-top:3px}
.who svg{width:14px;height:14px;flex:0 0 auto;color:var(--accent)}
.item.now{background:var(--now);box-shadow:inset 4px 0 0 var(--now-line)}
.item.past{opacity:.55}
.badge{display:inline-block;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:999px;background:var(--now-line);color:#2b2108;margin-left:6px;vertical-align:middle}
.link{display:inline-block;margin-top:6px;font-size:.85rem;color:var(--brand);font-weight:600;background:var(--soft);border:0;border-radius:8px;padding:4px 9px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;cursor:pointer;font-size:.92rem;min-width:84px}
.chips button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;font-weight:700;color:var(--brand);white-space:nowrap}
.vs{color:var(--muted);font-size:.8rem;padding:0 3px}
.mine{background:var(--soft2)}
.people{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.people span{background:var(--soft);border-radius:999px;padding:2px 9px;font-size:.82rem}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.cols b{font-size:.72rem;text-transform:uppercase;color:var(--muted);letter-spacing:.04em}
.num-badge{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:999px;background:var(--accent);color:#fff;font-size:.78rem;font-weight:700;margin-right:6px;padding:0 6px}
ol.steps{margin:0;padding-left:20px;font-size:.92rem}
ol.steps li{margin-bottom:6px}
details.card summary{cursor:pointer;font-weight:600}
.search{display:flex;gap:8px;margin-bottom:12px}
.search input{flex:1;font:inherit;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.res-sec{font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--accent);font-weight:700}
.muted{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.hero{background:linear-gradient(135deg,var(--brand),#2f7a55);color:#fff;border-radius:16px;padding:16px;margin-bottom:14px}
.hero .big{font-size:1.3rem;font-weight:700;margin:2px 0}
.hero .lbl{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;opacity:.85}
.hero .sub{opacity:.9;font-size:.9rem}
.hero .next{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.25)}
.install{display:none;margin-bottom:12px}
.install.show{display:flex;align-items:center;gap:10px}
.install p{margin:0;flex:1;font-size:.9rem}
.install button{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:8px 12px;font-weight:600;cursor:pointer}
.offline{font-size:.78rem;opacity:.85}
@media (min-width:640px){.item{grid-template-columns:110px 1fr}}
/* ── Autobús ── */
.buscfg{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.buscfg .lbl{flex:1;min-width:140px;font-weight:600}
.buscfg .lbl small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:1.3rem;cursor:pointer}
.stepper input{width:64px;height:42px;text-align:center;font:700 1.4rem system-ui;border-radius:12px;border:2px solid var(--brand);background:var(--card);color:var(--ink)}
.buscfg.unset .stepper input{border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.stats b{display:block;font-size:1.35rem;color:var(--brand);font-variant-numeric:tabular-nums}
.stats span{font-size:.74rem;color:var(--muted)}
.stats .warn b{color:var(--accent)}
.prow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 12px;cursor:pointer}
.prow:last-child{border-bottom:0}
.prow .box{flex:0 0 auto;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center}
.prow .box svg{width:18px;height:18px;display:none}
.prow.on .box{background:var(--brand);border-color:var(--brand);color:#fff}
.prow.on .box svg{display:block}
.prow.other .box{background:var(--muted);border-color:var(--muted);color:#fff}
.prow.other .box svg{display:block}
.prow.ask{background:var(--now)}
.prow .nm{flex:1;min-width:0}
.prow .nm b{display:block;font-weight:600}
.prow .nm small{color:var(--muted);font-size:.8rem}
.prow .nm small i{color:var(--accent);font-style:normal}
.busb{flex:0 0 auto;font-size:.75rem;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--soft);color:var(--brand);white-space:nowrap}
.busb.other{background:var(--soft2);color:var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.actions button{flex:1 1 150px;border:0;border-radius:12px;padding:12px;font-weight:600;cursor:pointer;background:var(--brand);color:var(--brand-ink)}
.actions button.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.actions button.danger{background:var(--card);color:#b3261e;border:1px solid var(--line)}
textarea.paste{width:100%;min-height:110px;font:inherit;font-size:.85rem;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-top:8px}
.formrow{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.formrow input,.formrow select{flex:1 1 140px;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.formrow button{border:0;border-radius:10px;padding:10px 14px;font-weight:600;background:var(--brand);color:var(--brand-ink);cursor:pointer}
.sw{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.sw:last-child{border-bottom:0}
.sw .bg{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 18px;font-weight:700;font-size:.9rem;color:#fff}
.sw .bg span{opacity:0}
.sw.r .bg{background:var(--brand)} .sw.r .bg span:first-child{opacity:1}
.sw.l .bg{background:#b3261e} .sw.l .bg span:last-child{opacity:1}
.sw .prow{position:relative;background:var(--card);border-bottom:0;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.sw .prow.anim{transition:transform .2s ease}
.swhint{font-size:.8rem;color:var(--muted);margin:-4px 0 8px;text-align:center}
.novan{display:flex;align-items:center;gap:12px;padding:11px 12px;border-top:1px dashed var(--line);opacity:.75}
.novan b{text-decoration:line-through;font-weight:600}
.novan .busb{background:#f6dcda;color:#b3261e}
.prow.pend{background:var(--soft2);box-shadow:inset 4px 0 0 var(--accent)}
.prow .info{flex:0 0 auto;width:30px;height:30px;border-radius:999px;background:var(--accent);color:#fff;font-weight:800;display:grid;place-items:center;font-size:1rem}
.prow .pdet{display:block;margin-top:6px;font-size:.84rem;color:var(--ink);line-height:1.35}
.prow .pdet em{display:block;font-style:normal;margin-top:4px;color:var(--accent);font-weight:600}
.pendbar{display:flex;align-items:center;gap:10px;background:var(--soft2);border:1px solid var(--accent);border-radius:12px;padding:10px 12px;margin-bottom:12px;cursor:pointer;width:100%;text-align:left}
.pendbar .info{flex:0 0 auto;width:28px;height:28px;border-radius:999px;background:var(--accent);color:#fff;font-weight:800;display:grid;place-items:center}
.pendbar span:last-child{flex:1;font-size:.9rem}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;z-index:20;max-width:90%;text-align:center}
</style>
</head>
<body>
<header>
  <h1 id="ttl">Tiempo de conquistar 2026<small>Tierra Alta · Campamento Internacional Guatemala</small></h1>
  <button class="iconbtn" id="btnSearch" aria-label="Buscar persona">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  </button>
</header>

<main id="app"></main>

<nav class="tabs" id="tabs">
  <button data-t="hoy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Hoy</button>
  <button data-t="programa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Programa</button>
  <button data-t="rally"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h12l-2 4 2 4H5"/></svg>Rally</button>
  <button data-t="com"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 3 4 4 4 8a4 4 0 0 1-8 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 0-7z"/><path d="M6 21h12"/></svg>Comunión</button>
  <button data-t="dep"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3.5 9.5c4 1 13 1 17 0M3.5 14.5c4-1 13-1 17 0M12 3c-3 4-3 14 0 18M12 3c3 4 3 14 0 18"/></svg>Deportes</button>
  <button data-t="bus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="15" rx="3"/><path d="M4 11h16M8 18v3M16 18v3"/><circle cx="8" cy="14.5" r=".8"/><circle cx="16" cy="14.5" r=".8"/></svg>Autobús</button>
</nav>

<script src="data.js"></script>
<script>
(function(){
'use strict';
const D = window.DATA;
const $app = document.getElementById('app');
const ICON_USER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>';
const ICON_PIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()
  .replace(/\bhn(o|a|os|as)\b\.?/g,' ').replace(/\s+/g,' ').trim();
const store = {
  get(k, d){ try { const v = localStorage.getItem('camp26.'+k); return v == null ? d : v; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem('camp26.'+k, v); } catch(e){} }
};

// ── tiempo ──
const toMin = t => { const m = String(t).replace('.',':').match(/(\d{1,2}):(\d{2})/); return m ? (+m[1])*60 + (+m[2]) : null; };
function range(h){
  const parts = String(h).split('-');
  const a = toMin(parts[0]); let b = parts[1] ? toMin(parts[1]) : null;
  if (b == null) b = a != null ? a + 30 : null;
  return [a, b];
}
function todayISO(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function nowMin(){ const d = new Date(); return d.getHours()*60 + d.getMinutes(); }
function sortedItems(day){ return day.items.map((it,i)=>({...it,_i:i,_r:range(it.h)})).sort((x,y)=>(x._r[0]-y._r[0]) || (x._i-y._i)); }
function currentDay(){
  const t = todayISO();
  return D.programa.find(d => d.fecha === t) || null;
}

// ── render helpers ──
function whoLine(r){ return r ? `<div class="who">${ICON_USER}<span>${esc(r)}</span></div>` : ''; }
const VER_LBL = { 'rally':'Ver rally', 'com':'Ver Comunión.com', 'dep-jue':'Ver deportes del jueves', 'dep-vs':'Ver deportes', 'plen':'Ver estaciones' };
function verBtn(v, dayId){
  if (!v) return '';
  let target = v;
  if (v === 'dep-vs') target = 'dep/' + (dayId === 'sab' ? 'sab' : 'vie');
  if (v === 'dep-jue') target = 'dep/jue';
  if (v === 'plen') target = 'rally/plen';
  return `<button class="link" data-go="${target}">${VER_LBL[v]} →</button>`;
}
function itemHTML(it, dayId, state){
  const [a,b] = it._r || range(it.h);
  return `<div class="item ${state||''}">
    <div class="time">${esc(it.h)}</div>
    <div>
      <div class="act">${esc(it.a)}${state==='now'?'<span class="badge">Ahora</span>':''}</div>
      ${it.l ? `<div class="meta">${esc(it.l)}</div>` : ''}
      ${whoLine(it.r)}
      ${it.d ? `<div class="desc">${esc(it.d)}</div>` : ''}
      ${verBtn(it.ver, dayId)}
    </div></div>`;
}
function people(arr){ return arr && arr.length ? `<div class="people">${arr.map(p=>`<span>${esc(p)}</span>`).join('')}</div>` : '<div class="meta">—</div>'; }
function seg(items, on, attr){ return `<div class="seg">${items.map(([k,l])=>`<button data-${attr}="${k}" class="${k===on?'on':''}">${esc(l)}</button>`).join('')}</div>`; }

// ── vistas ──
function viewHoy(){
  const day = currentDay();
  let html = `<div class="card install" id="installCard"><p>Instala la app para usarla sin internet.</p><button id="btnInstall">Instalar</button></div>`;
  if (!day){
    const first = D.programa[0], t = todayISO();
    const msg = t < first.fecha ? `El campamento empieza el ${first.dia.toLowerCase()} ${first.fechaTxt}.` : 'El campamento ya terminó. ¡Gracias por servir!';
    html += `<div class="hero"><div class="lbl">Campamento 2026</div><div class="big">${esc(D.titulo)}</div><div class="sub">${esc(msg)}</div></div>`;
    html += `<h3>Accesos rápidos</h3><div class="list">` + D.programa.map(d=>`<div class="item"><div class="time">${esc(d.dia)}<small>${esc(d.fechaTxt)}</small></div><div><div class="act">${d.items.length} actividades</div><button class="link" data-go="programa/${d.id}">Ver programa →</button></div></div>`).join('') + `</div>`;
    return html;
  }
  const items = sortedItems(day), n = nowMin();
  const now = items.filter(it => it._r[0] != null && it._r[0] <= n && n < it._r[1]);
  const next = items.filter(it => it._r[0] != null && it._r[0] > n);
  const nextStart = next.length ? next[0]._r[0] : null;
  const nextGroup = next.filter(it => it._r[0] === nextStart);
  html += `<div class="hero">
    <div class="lbl">${esc(day.dia)} ${esc(day.fechaTxt)} · Ahora</div>
    ${now.length ? now.map(it=>`<div class="big">${esc(it.a)}</div><div class="sub">${esc(it.h)}${it.l?' · '+esc(it.l):''}${it.r?' · '+esc(it.r):''}</div>`).join('') : '<div class="big">Sin actividad en este momento</div>'}
    ${nextGroup.length ? `<div class="next"><div class="lbl">Siguiente</div>${nextGroup.map(it=>`<div><b>${esc(it.h)}</b> · ${esc(it.a)}${it.r?' — '+esc(it.r):''}</div>`).join('')}</div>` : ''}
  </div>`;
  html += `<h3>Programa de hoy</h3><div class="list">` + items.map(it => {
    const st = (it._r[0] <= n && n < it._r[1]) ? 'now' : (it._r[1] <= n ? 'past' : '');
    return itemHTML(it, day.id, st);
  }).join('') + `</div>`;
  if (day.notas) html += notasHTML(day.notas);
  return html;
}
function notasHTML(nt){
  return `<h3>${esc(nt.titulo)}</h3><div class="list">` + nt.lista.map(([t,r,d])=>`<div class="item" style="grid-template-columns:1fr"><div><div class="act">${esc(t)}</div>${whoLine(r)}${d?`<div class="desc">${esc(d)}</div>`:''}</div></div>`).join('') + `</div>` + (nt.pie ? `<p class="meta">${esc(nt.pie)}</p>` : '');
}
function viewPrograma(sub){
  const cur = currentDay();
  const id = sub || (cur ? cur.id : D.programa[0].id);
  const day = D.programa.find(d=>d.id===id) || D.programa[0];
  const isToday = cur && cur.id === day.id, n = nowMin();

function buildIndex(){
  const idx = [], DAY = id => D.programa.findIndex(d=>d.id===id);
  const add = (dayId, h, txt, cat, t, s, go) => idx.push({d:DAY(dayId), h, txt, cat, t, s, go});
  D.programa.forEach(day=>{
    day.items.forEach(it=>{ if (it.r) add(day.id, it.h, it.r, 'Programa', it.a, it.l, 'programa/'+day.id); });
    if (day.notas) day.notas.lista.forEach(([t,r])=>add(day.id, day.notas.h||'', r, day.notas.titulo, t, '', 'programa/'+day.id));
  });
  D.plenarias.estaciones.forEach(s=>add('sab', '14:00-18:00', s.r, 'Plenarias', 'Estación '+s.n+': '+s.tema, s.lugar, 'rally/plen'));
  ['jue','vie','sab'].forEach(d=>D.comunion.actividades.forEach(x=>x.e.forEach(p=>add(d, '21:00-23:30', p, 'Comunión.com', x.a, x.l, 'com'))));
  D.deportesJueves.actividades.forEach(x=>x.e.forEach(p=>add('jue', x.h||'10:00-12:00', p, 'Deportes', x.a, x.l, 'dep/jue')));
  D.deportesVS.actividades.forEach(x=>{
    x.vie.forEach(p=>add('vie', x.hv||'15:00-18:00', p, 'Deportes', x.a, x.l, 'dep/vie'));
    x.sab.forEach(p=>add('sab', x.hs||'9:00-12:45', p, 'Deportes', x.a, x.l, 'dep/sab'));
  });
  idx.forEach(e=>{ const r = range(e.h); e.n = norm(e.txt); e.m = r[0] ?? 0; e.f = r[1] ?? 0; });
  return idx;
}

function runSearch(q){
  store.set('q', q);

function busList(){
  const el = document.getElementById('busList'); if (!el) return;
  const P = busPeople(), R = recs(), E = exts(), b = myBus();
  const f = store.get('bus.f','faltan'), h = store.get('bus.h',''), toks = norm(store.get('bus.q','')).split(' ').filter(Boolean);
  const rows = P.filter(p=>{

function busToggle(id){

  const R = recs(), E = exts(), pb = busOf(id,R,E);

  else if (pb && busAsk !== id){

function busSet(id, on){
  const b = myBus();
  if (!b){ toast('Primero escribe el número de tu bus arriba.'); return; }
  const R = recs(), E = exts();
  if (on){
    if (R[id] && R[id].b === b) return;
    if (busOf(id,R,E) && busAsk !== id){
      busAsk = id; clearTimeout(busAskT); busAskT = setTimeout(()=>{ busAsk = null; busList(); }, 4000);
      toast('Ya está en el bus ' + busOf(id,R,E) + '. Desliza otra vez para pasarlo al bus ' + b + '.');
      return busList();
    }
    R[id] = { b, t: Date.now() };
  } else {
    if (!R[id]){ if (E[id]) toast('Está registrado en el bus ' + E[id] + ' desde otro celular.'); return; }
    delete R[id];
  }
  busAsk = null; jset('bus.rec', R);
  if (navigator.vibrate) try { navigator.vibrate(15); } catch(e){}
  busRefresh();
}

let SW = null, swBlockClick = 0;
$app.addEventListener('pointerdown', e=>{
  const row = e.target.closest('.sw .prow'); if (!row || e.target.closest('[data-info]')) return;
  SW = { row, wrap: row.parentNode, id: row.dataset.pid, x: e.clientX, y: e.clientY, dx: 0, lock: null, pid: e.pointerId };
  row.classList.remove('anim');
});
$app.addEventListener('pointermove', e=>{
  if (!SW || e.pointerId !== SW.pid) return;
  const dx = e.clientX - SW.x, dy = e.clientY - SW.y;
  if (!SW.lock){ if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return; SW.lock = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v'; if (SW.lock === 'h') try { SW.row.setPointerCapture(e.pointerId); } catch(_){} }
  if (SW.lock !== 'h') return;
  SW.dx = dx; SW.row.style.transform = `translateX(${dx}px)`;
  SW.wrap.classList.toggle('r', dx > 0); SW.wrap.classList.toggle('l', dx < 0);
});
function swEnd(e){
  if (!SW || (e && e.pointerId !== SW.pid)) return;
  const { row, wrap, id, dx, lock } = SW; SW = null;
  if (lock !== 'h') return;
  swBlockClick = Date.now();
  const lim = Math.min(90, row.offsetWidth * 0.28);
  row.classList.add('anim'); row.style.transform = '';
  setTimeout(()=>{ wrap.classList.remove('r','l'); }, 200);
  if (dx > lim) setTimeout(()=>busSet(id, true), 180);
  else if (dx < -lim) setTimeout(()=>busSet(id, false), 180);
}
$app.addEventListener('pointerup', swEnd);
$app.addEventListener('pointercancel', swEnd);

function setBusNum(v){
  v = String(v).replace(/[^0-9a-zA-Z]/g,'').slice(0,3);
  store.set('bus.num', v); route();
}
function busShareText(){
  const R = recs(), P = busPeople(), by = {};
  Object.entries(R).forEach(([id,r])=>{ const p = P.find(x=>x.id===id); if (p) (by[r.b] = by[r.b] || []).push({p, t:r.t}); });
  const buses = Object.keys(by).sort((a,b)=>a.localeCompare(b,'es',{numeric:true}));
  if (!buses.length) return '';
  const hora = new Date().toLocaleTimeString('es-GT',{hour:'numeric',minute:'2-digit'});
  let txt = '';
  buses.forEach(bn=>{
    const L = by[bn].sort((x,y)=>x.p.n.localeCompare(y.p.n,'es'));
    txt += `🚌 BUS ${bn} · ${L.length} personas · ${hora}\n` + L.map((x,i)=>`${i+1}. ${x.p.n} (${x.p.h})`).join('\n') + '\n\n';
  });
  txt += buses.map(bn=>`#B${bn}=` + by[bn].filter(x=>!x.p.id.startsWith('x')).map(x=>x.p.id).join('.')).join('\n');
  return txt;
}
async function busShare(){
  const txt = busShareText();
  if (!txt) return toast('Aún no hay nadie registrado en este celular.');
  try { if (navigator.share){ await navigator.share({ text: txt }); return; } } catch(e){ if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(txt); toast('Lista copiada. Pégala en WhatsApp.'); }
  catch(e){ const t = document.getElementById('busPaste'); if (t){ t.closest('details').open = true; t.value = txt; t.select(); } toast('Copia el texto del recuadro.'); }
}
function busImport(){
  const t = document.getElementById('busPaste'); if (!t) return;
  const re = /#B([0-9a-zA-Z]{1,3})=([a-z0-9.]*)/g, E = exts(), ids = new Set(HOS.personas.map(p=>p[0]));
  let m, buses = 0, n = 0;
  const found = [];
  while ((m = re.exec(t.value))) found.push([m[1], m[2].split('.').filter(x=>ids.has(x))]);
  if (!found.length) return toast('No encontré la línea #B… en el texto pegado.');
  found.forEach(([bn, list])=>{
    Object.keys(E).forEach(k=>{ if (E[k] === bn) delete E[k]; });
    list.forEach(id=>{ E[id] = bn; n++; }); buses++;
  });
  jset('bus.ext', E); t.value = '';
  toast(`Importado: ${n} personas de ${buses} bus${buses>1?'es':''}.`); route();
}
function busAdd(){
  const n = (document.getElementById('newName').value || '').trim(); if (!n) return toast('Escribe el nombre.');
  const h = document.getElementById('newHos').value, X = jget('bus.extra', []);
  X.push(['x' + Date.now().toString(36), n, h]); jset('bus.extra', X); toast('Agregado: ' + n); route();
}
let busResetT = 0;
function busReset(){
  if (Date.now() - busResetT > 4000){ busResetT = Date.now(); return toast('Toca otra vez para borrar todos los registros de este celular.'); }
  ['bus.rec','bus.ext','bus.extra'].forEach(k=>store.set(k,'')); busResetT = 0; toast('Registros borrados.'); route();
}
function busTotals(){
  const P = busPeople(), R = recs(), E = exts(), by = {};
  let sin = 0;
  P.forEach(p=>{ const pb = busOf(p.id,R,E); if (!pb){ sin++; return; }
    const t = by[pb] = by[pb] || { n:0, H:0, M:0, hs:{} };
    t.n++; if (p.s === 'H' || p.s === 'M') t[p.s]++; t.hs[p.h] = (t.hs[p.h]||0) + 1; });
  const buses = Object.keys(by).sort((a,b)=>a.localeCompare(b,'es',{numeric:true}));
  const up = P.length - sin, b = myBus();
  return `<h3>Totales por bus</h3><div class="list"><table><thead><tr><th>Bus</th><th>Total</th><th>H</th><th>M</th></tr></thead><tbody>${
    buses.map(bn=>{ const t = by[bn]; return `<tr class="${bn===b?'mine':''}"><td class="num">Bus ${esc(bn)}</td><td><b>${t.n}</b><div class="meta" style="font-size:.75rem">${Object.entries(t.hs).map(([h,n])=>esc(h)+' '+n).join(' · ')}</div></td><td>${t.H}</td><td>${t.M}</td></tr>`; }).join('')
    }<tr><td class="num" style="color:var(--accent)">Sin bus</td><td><b style="color:var(--accent)">${sin}</b></td><td></td><td></td></tr><tr><td class="num">Total</td><td><b>${up}/${P.length}</b> subieron</td><td></td><td></td></tr></tbody></table></div>`;
}
function busResumen(){
  const P = busPeople(), R = recs(), E = exts(), by = {}, none = [], dup = [];
  P.forEach(p=>{
    const pb = busOf(p.id,R,E);
    if (!pb) none.push(p); else (by[pb] = by[pb] || []).push(p);
    if (R[p.id] && E[p.id] && E[p.id] !== R[p.id].b) dup.push(`${p.n}: bus ${R[p.id].b} (aquí) y bus ${E[p.id]} (importado)`);
  });
  const buses = Object.keys(by).sort((a,b)=>a.localeCompare(b,'es',{numeric:true}));
  let html = busTotals();
  const pk = Object.keys(PEND).filter(id=>P.some(p=>p.id===id));
  if (pk.length) html += `<h3 style="color:var(--accent)">Pendientes · ${pk.length}</h3><div class="list">${pk.map(id=>{ const p = P.find(x=>x.id===id), pd = PEND[id], pb = busOf(id,R,E);
    return `<div class="item" style="grid-template-columns:1fr;background:var(--soft2);box-shadow:inset 4px 0 0 var(--accent)"><div><div class="act">⚠ ${esc(p.n)}${pb?` <span class="busb">Bus ${esc(pb)}</span>`:''}</div><div class="meta">${esc(p.h)}</div><div class="desc">${esc(pd.motivo)}</div>${pd.sugerencia?`<div class="desc" style="color:var(--accent);font-weight:600">Sugerencia: ${esc(pd.sugerencia)}</div>`:''}</div></div>`; }).join('')}</div>`;
  const lib = HOS.libres || {};
  if (Object.keys(lib).length) html += `<p class="meta">Lugares libres: ${Object.entries(lib).map(([h,n])=>esc(h)+' '+n).join(' · ')}</p>`;
  html += `<p class="meta">Junta aquí lo de todos los buses: cada encargado comparte su lista y tú la importas en “Lista para checar”.</p>`;
  if (dup.length) html += `<div class="card" style="border-color:var(--accent)"><b>Aparece en dos buses</b>${dup.map(d=>`<div class="meta">${esc(d)}</div>`).join('')}</div>`;
  if (!buses.length) html += `<div class="empty">Todavía no hay nadie registrado.</div>`;
  buses.forEach(bn=>{
    const L = by[bn].sort((x,y)=>x.n.localeCompare(y.n,'es'));
    html += `<h3>Bus ${esc(bn)} · ${L.length}</h3><div class="list"><table><tbody>${L.map((p,i)=>`<tr><td class="num">${i+1}</td><td><b>${esc(p.n)}</b><div class="meta">${esc(p.h)}${R[p.id]?'':' · importado'}</div></td></tr>`).join('')}</tbody></table></div>`;
  });
  const NV = HOS.noVan || [];
  if (NV.length) html += `<h3>No van en el bus · ${NV.length}</h3><div class="list">${NV.map(([id,n,m])=>`<div class="novan" style="border-top:0"><span class="nm" style="flex:1"><b>${esc(n)}</b></span><span class="busb">NO va</span></div>`).join('')}</div>`;
  if (none.length) html += `<h3>Sin bus registrado · ${none.length}</h3><div class="list"><table><tbody>${none.sort((x,y)=>x.n.localeCompare(y.n,'es')).map(p=>`<tr><td><b>${esc(p.n)}</b><div class="meta">${esc(p.h)}</div></td></tr>`).join('')}</tbody></table></div>`;
  return html;
}

// ── router ──
const VIEWS = { hoy:viewHoy, programa:viewPrograma, rally:viewRally, com:viewCom, dep:viewDep, buscar:viewBuscar, bus:viewBus };
function route(){
  const [tab, sub] = (location.hash.slice(1) || 'hoy').split('/');
  const fn = VIEWS[tab] || viewHoy;
  $app.innerHTML = fn(sub);
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on', b.dataset.t === tab));
  if (tab === 'buscar'){ const i = document.getElementById('q'); runSearch(i.value); i.addEventListener('input', ()=>runSearch(i.value)); if (!i.value) i.focus(); }
  if (tab === 'bus'){
    busRefresh();
    const q = document.getElementById('busQ'); if (q) q.addEventListener('input', ()=>{ store.set('bus.q', q.value); busList(); });
    const bn = document.getElementById('busNum'); bn.addEventListener('change', ()=>setBusNum(bn.value));
    bn.addEventListener('keydown', e=>{ if (e.key === 'Enter') bn.blur(); });
  }
  showInstall();
}
function go(h){ if (location.hash.slice(1) === h) route(); else location.hash = h; window.scrollTo(0,0); }

document.getElementById('tabs').addEventListener('click', e=>{ const b = e.target.closest('button'); if (b) go(b.dataset.t); });
document.getElementById('btnSearch').addEventListener('click', ()=>go('buscar'));
$app.addEventListener('click', e=>{
  const inf = e.target.closest('[data-info]');
  if (inf){ const id = inf.dataset.info; busOpen.has(id) ? busOpen.delete(id) : busOpen.add(id); return busList(); }
  const b = e.target.closest('button'); if (!b) return;
  const ds = b.dataset;
  if (ds.go) return go(ds.go);
  if (ds.day) return go('programa/'+ds.day);
  if (ds.dep) return go('dep/'+ds.dep);
  if (ds.rm){ store.set('rallyMode', ds.rm); return go('rally/'+ds.rm); }
  if (ds.team){ store.set('team', ds.team === store.get('team','') ? '' : ds.team); return route(); }
  if (ds.ronda){ store.set('ronda', ds.ronda); return route(); }
  if (ds.est){ store.set('estacion', ds.est); return route(); }
  if (ds.pid){ if (Date.now() - swBlockClick < 400) return; return toast('Desliza → para marcar · ← para quitar'); }
  if (ds.bmode) return go('bus/' + ds.bmode);
  if (ds.bf){ store.set('bus.f', ds.bf); return route(); }
  if ('bh' in ds){ store.set('bus.h', ds.bh); return route(); }
  if (ds.bact){
    const n = parseInt(myBus(), 10) || 0;
    if (ds.bact === 'minus') return setBusNum(n > 1 ? n - 1 : 1);
    if (ds.bact === 'plus') return setBusNum(n + 1);
    if (ds.bact === 'share') return busShare();
    if (ds.bact === 'import') return busImport();
    if (ds.bact === 'add') return busAdd();
    if (ds.bact === 'reset') return busReset();
  }
  if (b.id === 'btnInstall' && deferred){ deferred.prompt(); deferred.userChoice.finally(()=>{ deferred = null; showInstall(); }); }
});
window.addEventListener('hashchange', route);

// refresca "Ahora" cada minuto
setInterval(()=>{ const t = (location.hash.slice(1)||'hoy').split('/')[0]; if (t==='hoy' || t==='programa') route(); }, 60000);

// ── instalación / offline ──
let deferred = null;
function showInstall(){ const c = document.getElementById('installCard'); if (c) c.classList.toggle('show', !!deferred); }
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferred = e; showInstall(); });
if ('serviceWorker' in navigator) window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

route();
})();
</script>
